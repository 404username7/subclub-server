<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SubClub upload test</title>
</head>
<body>
  <h2>SubClub private image upload test</h2>
  <p>Use only a short-lived Supabase access token. This page keeps it in memory and sends it to the server you enter.</p>
  <label>Server URL <input id="server" type="url" value="http://localhost:8080" size="48" /></label>
  <br /><br />
  <label>Supabase access token <input id="token" type="password" autocomplete="off" size="64" /></label>
  <br /><br />
  <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp,image/gif" />
  <button id="uploadBtn">Upload image</button>
  <pre id="output"></pre>

  <script>
    const output = document.getElementById("output");
    const button = document.getElementById("uploadBtn");
    const input = document.getElementById("fileInput");

    button.addEventListener("click", async () => {
      const file = input.files[0];
      const token = document.getElementById("token").value.trim();
      const server = document.getElementById("server").value.trim().replace(/\/$/, "");
      if (!file || !token || !server) {
        output.textContent = "Enter the server URL and access token, then choose an image.";
        return;
      }

      const formData = new FormData();
      formData.append("file", file);
      output.textContent = "Uploading...";
      try {
        const response = await fetch(`${server}/api/upload`, {
          method: "POST",
          headers: { Authorization: `Bearer ${token}` },
          body: formData
        });
        output.textContent = `Status: ${response.status}\n\n${await response.text()}`;
      } catch (error) {
        output.textContent = `Upload failed: ${error.message}`;
      }
    });
  </script>
</body>
</html>
